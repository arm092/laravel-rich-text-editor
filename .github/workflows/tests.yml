name: Tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} / Livewire ${{ matrix.livewire }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.1', laravel: '10.*', testbench: '8.*', phpunit: '10.5.*', livewire: '3.*' }
          - { php: '8.2', laravel: '11.*', testbench: '9.*', phpunit: '11.*', livewire: '3.*' }
          - { php: '8.3', laravel: '12.*', testbench: '10.*', phpunit: '11.*', livewire: '4.*' }
          - { php: '8.4', laravel: '13.*', testbench: '11.*', phpunit: '12.*', livewire: '4.*' }
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with: { php-version: '${{ matrix.php }}', coverage: none }
      - run: composer require --dev "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" "phpunit/phpunit:${{ matrix.phpunit }}" "livewire/livewire:${{ matrix.livewire }}" --with-all-dependencies --no-interaction --no-progress
      - run: composer validate --strict
      - run: composer audit --locked
      - run: composer test

  php-without-livewire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.4', coverage: none }
      - run: composer install --no-interaction --no-progress
      - run: composer test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: '20.20.2', cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run check:bundles
      - run: git diff --exit-code -- dist
      - uses: DavidAnson/markdownlint-cli2-action@v22
        with:
          globs: |
            README.md
            docs/**/*.md
            *.md
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser
